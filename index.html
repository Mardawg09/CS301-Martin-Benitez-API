<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Recipe Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <p class="kicker">A weeknight-tested collection</p>

        <h1>Cook something <em>good</em> tonight</h1>

        <p class="sub">
            Search, browse, and cook through a growing catalog of recipes —
            with the ingredients, steps, and nutrition laid out plainly.
        </p>
    </header>


    <main>

        <!-- SEARCH SECTION -->
        <section class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a recipe, ingredient, or type..."
            >

            <button onclick="searchRecipes()">
                Search
            </button>

            <button
                class="secondary"
                onclick="loadRecipes()"
            >
                Show All
            </button>

        </section>


        <!-- RECIPE GRID SECTION -->
        <section>

            <h2>Browse recipes</h2>

            <div
                id="recipeList"
                class="recipe-list loading-state"
            >
                Loading recipes...
            </div>

        </section>

    </main>


    <!-- RECIPE DETAIL MODAL -->
    <div id="modalOverlay" class="modal-overlay">
        <div id="modalCard" class="modal-card">
            <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
            <div id="modalBody"></div>
        </div>
    </div>


    <footer>

        <p>
            Data provided by the Simple Recipe API
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
