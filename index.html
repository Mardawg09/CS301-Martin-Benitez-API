<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Sneakers Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <!-- Swapped the car emoji for a sneaker and made the title pop -->
        <h1>👟 Sneaker Finder</h1>
        <p>A modern catalog powered by a REST API</p>
    </header>
    
    <main>
        <!-- SEARCH SECTION -->
        <section class="search">
            <!-- Updated placeholder text -->
            <input type="text" id="searchInput" placeholder="Search for a brand, model, or colorway...">
            
            <!-- Fixed the typo in the function name from searchSneakeer() to searchSneakers() -->
            <button onclick="searchSneakers()"> Search </button>
            
            <!-- Changed loadCars() to loadSneaker() -->
            <button class="secondary" onclick="loadSneaker()"> Show All </button>
        </section>

        <!-- SNEAKER GRID SECTION -->
        <section>
            <h2>Browse Sneakers</h2>
            
            <!-- CRITICAL FIX: Changed id to "sneakerList" and class to "sneaker-list" -->
            <div id="sneakerList" class="sneaker-list">
                Loading sneakers...
            </div>
        </section>
    </main>

    <footer>
        <p> Data provided by the Simple Sneakers API </p>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
